name: Refresh lockfile for Stage 7

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-lock-stage7.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(stage7): regenera package-lock"
          git push origin HEAD:${{ github.head_ref }}
