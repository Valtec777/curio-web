name: Complete Plumareli rebrand

on:
  push:
    branches:
      - agent/complete-plumareli-rebrand

permissions:
  contents: write

jobs:
  replace-visible-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/complete-plumareli-rebrand

      - name: Replace visible Curio brand strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path('app'), Path('components'), Path('lib'), Path('public'), Path('supabase/templates')]
          allowed = {'.ts', '.tsx', '.js', '.jsx', '.css', '.html', '.md', '.txt', '.json', '.xml'}
          replacements = (
              ('CURIÓ', 'PLUMARELI'),
              ('Curió', 'Plumareli'),
              ('curió', 'plumareli'),
          )

          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in allowed:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  new = text
                  for old, replacement in replacements:
                      new = new.replace(old, replacement)
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed.append(str(path))

          print(f'Updated {len(changed)} files')
          for path in changed:
              print(path)
          PY

      - name: Remove temporary workflow and failed staging artifacts
        shell: bash
        run: |
          rm -f .github/workflows/complete-plumareli-rebrand.yml
          rm -f .brand-assets/plumareli-symbol.png.b64
          rm -f public/brand/test-local-path.txt
          rmdir .brand-assets 2>/dev/null || true
          rmdir public/brand 2>/dev/null || true

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib public supabase/templates .github .brand-assets 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "replace remaining visible Curió branding with Plumareli"
          git push origin HEAD:agent/complete-plumareli-rebrand
