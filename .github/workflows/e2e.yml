name: E2E smoke tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Validate release, go-live and observability contracts
        run: npm run css:check && npm run responsive:check && npm run color:check && npm run security:check && npm run performance:check && npm run discoverability:check && npm run dependencies:check && npm run release:check && npm run go-live:check && npm run observability:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
        run: npm run build

      - name: Install E2E dependencies
        run: npm install --prefix e2e

      - name: Install Chromium
        run: cd e2e && npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        run: npm --prefix e2e test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
